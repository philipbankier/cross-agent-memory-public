name: Attested Linux image archives

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact sanitized public source revision approved by the owner
        required: true
        type: string
      publication_approved:
        description: The owner has approved this source and public attestation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  images:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      PUBLICATION_APPROVED: ${{ inputs.publication_approved }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      CAM_EXPECT_ARCH: ${{ matrix.arch }}
      CAM_IMAGE: cross-assistant-memory:release-${{ github.sha }}-${{ matrix.arch }}
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Refuse unapproved or private execution
        run: |
          test "$PUBLICATION_APPROVED" = true
          test "$REPOSITORY_PRIVATE" = false
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_REVISION" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve and verify this job's isolated image
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(docker image ls --quiet --filter "reference=$CAM_IMAGE")"
          echo 'CAM_IMAGE_OWNED=1' >> "$GITHUB_ENV"
          script/verify-container
      - name: Save and reload the exact image archive
        run: |
          mkdir dist
          archive="dist/memory-image-$CAM_EXPECT_ARCH.docker.tar.gz"
          before=$(docker image inspect --format '{{.Id}}' "$CAM_IMAGE")
          docker image save "$CAM_IMAGE" | gzip -n > "$archive"
          gzip --test "$archive"
          docker image rm "$CAM_IMAGE"
          docker image load --input "$archive"
          test "$(docker image inspect --format '{{.Id}}' "$CAM_IMAGE")" = "$before"
      - name: Install the previously qualified hash-pinned SBOM scanner
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/cam-release-sbom.XXXXXX")
          echo "CAM_SBOM_TOOL=$work" >> "$GITHUB_ENV"
          case "$CAM_EXPECT_ARCH" in
            amd64) digest=c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47 ;;
            arm64) digest=dfdf0537610113edbefe1f1fc6548bc957b2d77439636ec824fcf0e10d46d054 ;;
            *) exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 --fail --location --max-time 120 \
            --max-filesize 40000000 \
            "https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_$CAM_EXPECT_ARCH.tar.gz" \
            --output "$work/syft.tar.gz"
          printf '%s  %s\n' "$digest" "$work/syft.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file "$work/syft.tar.gz" --directory "$work" syft
          test -f "$work/syft" && test ! -L "$work/syft"
      - name: Bind the reloaded image, archive and SBOMs
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          "$CAM_SBOM_TOOL/syft" scan "docker:$CAM_IMAGE" \
            -o "cyclonedx-json=dist/linux-$CAM_EXPECT_ARCH-image.sbom.cdx.json"
          "$CAM_SBOM_TOOL/syft" scan dir:ui/memory-app \
            -o "cyclonedx-json=dist/linux-$CAM_EXPECT_ARCH-ui-source.sbom.cdx.json"
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          image = json.loads(subprocess.check_output(
              ["docker", "image", "inspect", os.environ["CAM_IMAGE"]]
          ))[0]
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert revision == os.environ["EXPECTED_REVISION"]
          assert image["Config"]["Labels"]["org.opencontainers.image.revision"] == revision
          assert image["Os"] == "linux" and image["Architecture"] == os.environ["CAM_EXPECT_ARCH"]
          root = Path("dist")
          archive = "memory-image-" + os.environ["CAM_EXPECT_ARCH"] + ".docker.tar.gz"
          prefix = "linux-" + os.environ["CAM_EXPECT_ARCH"]
          names = (archive, prefix + "-image.sbom.cdx.json", prefix + "-ui-source.sbom.cdx.json")
          assert {path.name for path in root.iterdir()} == set(names)
          for name in names[1:]:
              sbom = json.loads((root / name).read_bytes())
              assert sbom["bomFormat"] == "CycloneDX" and sbom["components"]
          hashes = {}
          for name in names:
              with (root / name).open("rb") as stream:
                  hashes[name] = hashlib.file_digest(stream, "sha256").hexdigest()
          identity = {
              "revision": revision,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "image_id": image["Id"],
              "platform": image["Os"] + "/" + image["Architecture"],
              "distribution": "docker-save gzip archive, not a registry digest",
              "generator": "syft 1.54.1",
              "artifact_sha256": hashes,
              "ui_inventory_scope": "source and build dependencies, not runtime image contents",
              "signature": "separate GitHub attestation bundle",
          }
          (root / (prefix + "-build-identity.json")).write_text(json.dumps(identity, indent=2) + "\n")
          PY
          (cd dist && sha256sum -- *.docker.tar.gz *.json > "linux-$CAM_EXPECT_ARCH-SHA256SUMS")
      - name: Attest these exact public build outputs
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/dist/*.docker.tar.gz
            ${{ github.workspace }}/dist/*.sbom.cdx.json
            ${{ github.workspace }}/dist/linux-*-build-identity.json
            ${{ github.workspace }}/dist/linux-*-SHA256SUMS
          push-to-registry: false
          create-storage-record: false
      - name: Retain and verify the signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp -- "$BUNDLE_PATH" "dist/linux-$CAM_EXPECT_ARCH-attestation.json"
          (cd dist && sha256sum --check --strict "linux-$CAM_EXPECT_ARCH-SHA256SUMS")
          gh --version
          for artifact in dist/*.docker.tar.gz dist/*.sbom.cdx.json dist/linux-*-build-identity.json dist/linux-*-SHA256SUMS; do
            gh attestation verify "$artifact" \
              --bundle "dist/linux-$CAM_EXPECT_ARCH-attestation.json" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/attested-images.yml" \
              --signer-digest "$EXPECTED_REVISION" \
              --source-digest "$EXPECTED_REVISION" \
              --deny-self-hosted-runners
          done
      - name: Retain only the public image outputs and bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attested-image-${{ matrix.arch }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove only this job's owned image and scanner
        if: always()
        run: |
          if [ "${CAM_IMAGE_OWNED:-0}" = 1 ] && docker image inspect "$CAM_IMAGE" >/dev/null 2>&1; then
            docker image rm "$CAM_IMAGE"
          fi
          if [ -n "${CAM_SBOM_TOOL:-}" ]; then
            case "$CAM_SBOM_TOOL" in
              "$RUNNER_TEMP"/cam-release-sbom.*) rm -r -- "$CAM_SBOM_TOOL" ;;
              *) exit 1 ;;
            esac
          fi
