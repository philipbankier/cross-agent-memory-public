<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Cross-Agent Memory</title>
  <desc id="desc">Six history sources connect to a memory node you own. Your existing assistant searches it and opens exact evidence. Local or remote, with no separate answer model.</desc>
  <rect width="1280" height="560" fill="#111820"/>
  <path d="M0 480H1280M704 0V480" stroke="#33404c"/>
  <g font-family="Arial, Helvetica, sans-serif" letter-spacing="0">
    <rect x="48" y="42" width="36" height="36" rx="4" fill="#d7f275"/>
    <path d="M58 52v16h16M58 60h16M66 52v16" fill="none" stroke="#111820" stroke-width="2"/>
    <text x="100" y="67" fill="#d7f275" font-size="20">Open source. Owner controlled.</text>
    <text x="48" y="174" fill="#ffffff" font-size="70" font-weight="700">Cross-Agent</text>
    <text x="48" y="252" fill="#ffffff" font-size="70" font-weight="700">Memory</text>
    <text x="48" y="316" fill="#d3dce4" font-size="27">Your history. Your infrastructure.</text>
    <text x="48" y="354" fill="#d3dce4" font-size="27">Your next assistant, already in context.</text>
    <text x="48" y="425" fill="#aab8c6" font-size="20">Search across assistants. Check the original evidence.</text>
    <g fill="#1b2631" stroke="#536272">
      <rect x="752" y="48" width="224" height="48" rx="4"/><rect x="992" y="48" width="240" height="48" rx="4"/>
      <rect x="752" y="108" width="224" height="48" rx="4"/><rect x="992" y="108" width="240" height="48" rx="4"/>
      <rect x="752" y="168" width="224" height="48" rx="4"/><rect x="992" y="168" width="240" height="48" rx="4"/>
    </g>
    <g fill="#f0f4f7" font-size="21">
      <text x="772" y="79">Codex</text><text x="1012" y="79">ChatGPT</text>
      <text x="772" y="139">Claude Code</text><text x="1012" y="139">Claude</text>
      <text x="772" y="199">Grok Build</text><text x="1012" y="199">Grok</text>
    </g>
    <path d="M864 216v20h128m120-20v20H992v30" fill="none" stroke="#9daebe" stroke-width="2"/>
    <rect x="832" y="266" width="320" height="65" rx="4" fill="#d7f275"/>
    <text x="992" y="305" fill="#111820" text-anchor="middle" font-size="24" font-weight="700">Your memory node</text>
    <path d="M992 331v37" stroke="#9daebe" stroke-width="2"/>
    <rect x="792" y="368" width="400" height="70" rx="4" fill="#213c46" stroke="#78bdb8"/>
    <text x="992" y="397" fill="#dcf4ef" text-anchor="middle" font-size="21">Your assistant, via read-only MCP</text>
    <text x="992" y="423" fill="#aad4d0" text-anchor="middle" font-size="17">Search + exact evidence + source status</text>
    <text x="48" y="529" fill="#f0f4f7" font-size="20">Local or remote</text>
    <text x="398" y="529" fill="#f0f4f7" font-size="20">No separate answer model</text>
    <text x="848" y="529" fill="#f0f4f7" font-size="20">Apache 2.0</text>
  </g>
</svg>
